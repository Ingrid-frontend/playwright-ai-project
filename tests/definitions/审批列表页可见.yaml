name: 审批列表页可见
goal: 打开我的审批列表并确认列表信号可见
description: 用于页面变化检测 / 样式守护；截图 scriptKey=intent/dev/审批列表页可见
env: dev
entry: /main/approve
scriptKey: intent/dev/审批列表页可见
trustLevel: trial
reviewRequired: false
preconditions:
  - 已登录且有审批权限
constraints:
  - 禁止 nth()
  - 禁止把 @N 写入定义
assertions:
  - 我的审批
steps:
  - id: step-1
    action: goto
    path: /main/approve
    optional: false
  - id: step-2
    action: assert
    kind: text
    expect: 我的审批
    optional: false
    evidence:
      - screenshot
  - id: step-3
    action: screenshot
    snapshotName: approval-list
    state: normal
    mode: stable
    optional: false
