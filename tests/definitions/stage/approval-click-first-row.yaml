name: 审批列表点击首行
goal: 在我的审批列表点击第一行并确认行内操作区仍可见（进详情依赖产品交互，步骤可选）
env: stage
entry: /main/approve
scriptKey: intent/审批列表点击首行
trustLevel: trial
reviewRequired: false
constraints:
  - 禁止 nth()
  - 禁止把 @N 写入定义
  - 列表无数据时允许跳过点击与后续步骤
steps:
  - id: step-1
    action: goto
    path: /main/approve
  - id: step-2
    action: assert
    kind: text
    expect: 我的审批
    evidence: [screenshot]
  - id: step-3
    action: screenshot
    snapshotName: approval-list
    state: normal
    mode: stable
  - id: step-4
    action: click
    description: 第1行
    optional: true
  - id: step-5
    action: wait
    timeoutMs: 1500
    optional: true
  - id: step-6
    action: assert
    kind: text
    expect: 通过
    optional: true
    evidence: [screenshot]
  - id: step-7
    action: screenshot
    snapshotName: approval-after-row-click
    state: normal
    mode: stable
    optional: true
assertions:
  - 我的审批
