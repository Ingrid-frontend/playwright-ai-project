name: 审批列表页可见
goal: 打开我的审批列表并确认列表信号可见
env: stage
entry: /main/approve
scriptKey: intent/审批列表页可见
trustLevel: trial
reviewRequired: false
constraints:
  - 禁止 nth()
  - 禁止把 @N 写入定义
steps:
  - id: step-1
    action: goto
    path: /main/approve
  - id: step-2
    action: assert
    kind: text
    expect: 我的审批
    evidence: [screenshot]
  - id: step-3
    action: screenshot
    snapshotName: approval-list
    state: normal
    mode: stable
assertions:
  - 我的审批
