name: 汇联易-我的审批搜索功能巡检
goal: 在待审批列表验证关键字搜索、空结果与 Tab 切换
description: >-
  自 EgoLite approve_monitor 改写为 Studio Intent。
  无「共N条」精确计数与 equals_baseline；搜索框覆盖填写代替清空。
env: dev
entry: /main/approve
scriptKey: intent/dev/审批列表页筛选测试
trustLevel: trial
reviewRequired: false
preconditions:
  - 已登录且有审批权限
  - 待审批列表存在申请人含 DEV管理员 的单据
  - 存在单号 CD2085297215794155522（或同前缀单据）
constraints:
  - 禁止 nth()
  - 禁止把 @N 写入定义
assertions:
  - 我的审批
  - 待审批
steps:
  - id: step-1
    action: goto
    path: /main/approve
    optional: false

  - id: step-2
    action: assert
    kind: text
    expect: 我的审批
    optional: false
    evidence:
      - screenshot

