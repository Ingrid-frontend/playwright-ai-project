name: 审批列表意图样例
goal: 验证用户可以从审批入口进入列表页
description: >
  验证用户可以从审批入口进入列表页。
  本文件为 Intent 格式样例；跑真实环境前请确认 entry / 文案与当前产品一致。
env: stage
profile: default
entry: /main/approve

preconditions:
  - 用户已登录
  - 当前账号具有审批权限

constraints:
  - 禁止 nth()
  - 优先 role / label / text
  - 不允许依赖随机 class
  - 禁止固定 sleep（除 wait 步骤）
  - 禁止把 @N 写入定义；运行时再从 Snapshot 解析

steps:
  - id: open-list
    action: goto
    path: /main/approve
  - id: see-list
    action: assert
    kind: text
    expect: 审批
    evidence: [screenshot]

assertions:
  - 审批
