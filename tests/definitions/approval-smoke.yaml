name: 审批列表意图样例
description: >
  验证用户可以从审批入口进入列表页。
  本文件为 Intent 格式样例；跑真实环境前请确认 entry / 文案与当前产品一致。
env: stage
profile: default
entry: /approval/list

preconditions:
  - 用户已登录
  - 当前账号具有审批权限

constraints:
  - 禁止 nth()
  - 优先 role / label / text
  - 不允许依赖随机 class
  - 禁止固定 sleep（除 wait 步骤）

steps:
  - id: open-list
    action: goto
    path: /approval/list
  - id: see-list
    action: assert
    description: 审批
    evidence: [screenshot]

assertions:
  - 页面包含审批相关内容
