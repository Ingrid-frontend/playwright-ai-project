name: Style Drift Mock 演示
goal: 离线验证样式指纹采集、对比、报告三档，无需登录
description: Studio「样式守护」默认演示用例
env: stage
scriptKey: mock/style-drift-demo
entry: tests/fixtures/style-drift-mock.html
styleChecks:
  - key: primary-btn
    selector: "#primary-btn"
    label: 主按钮
    props: [backgroundColor, color, fontSize, borderRadius]
    required: true
    snapshotName: mock-list
  - key: page-title
    selector: "#page-title"
    label: 页面标题
    props: [color, fontSize, fontWeight]
    required: true
    snapshotName: mock-list
  - key: list-card
    selector: ".list-card"
    label: 列表卡片
    props: [backgroundColor, borderRadius, boxShadow]
    required: false
    snapshotName: mock-list
steps:
  - id: open
    action: goto
    url: "file://{repoRoot}/tests/fixtures/style-drift-mock.html"
  - id: wait-ready
    action: wait
    timeoutMs: 300
  - id: capture-list
    action: screenshot
    snapshotName: mock-list
    state: normal
    mode: stable
