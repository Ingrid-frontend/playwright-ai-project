name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      publish_pages:
        description: Publish reports to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baseline PR gate
        if: github.event_name == 'pull_request'
        run: npm run check-baseline-pr -- --base=origin/${{ github.base_ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Verify spec-meta
        run: node scripts/verify/verify-spec-meta-flow.cjs --env=stage

      - name: Verify ego selector probe logic
        run: node scripts/verify/verify-ego-selector-probe.cjs

      - name: Smoke report modules
        run: npm run smoke

      - name: Pipeline raw recordings (PR only)
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^tests/raw-recordings/'; then
            npm run pipeline-raw-to-optimized
          else
            echo "No raw-recordings changes, skip pipeline"
          fi

      - name: Login (storage state)
        run: npm run login
        env:
          PLAYWRIGHT_ENV: stage
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Run optimized tests (Chromium + WebKit)
        run: npx playwright test --project=optimized --project=optimized-webkit
        env:
          PLAYWRIGHT_ENV: stage
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Screenshot compare with gate
        run: npm run compare-screenshots -- --gate

      - name: Analyze errors on failure
        if: failure()
        run: npm run analyze-errors
        continue-on-error: true

      - name: Bundle CI artifacts
        if: always()
        run: npm run report:bundle-ci
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          CI_BUNDLE_TEST_RESULTS: ${{ job.status == 'failure' && '1' || '0' }}

      - name: PR UI issues comment (optional)
        if: github.event_name == 'pull_request' && always()
        run: npm run pr-comment-ui-issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        continue-on-error: true

      - name: Upload full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-report-${{ github.run_id }}
          path: ci-artifacts/
          retention-days: 30
          if-no-files-found: ignore

      - name: Feishu notify on failure
        if: failure() && secrets.FEISHU_WEBHOOK_URL != ''
        run: npx tsx scripts/flow/notify-failure.ts
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          FEISHU_MODE: links
          ENABLE_GITHUB: '1'
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PUBLIC_REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        continue-on-error: true

  publish-pages:
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download full report
        uses: actions/download-artifact@v4
        with:
          name: full-report-${{ github.run_id }}
          path: ci-artifacts

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ci-artifacts/public-reports

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
