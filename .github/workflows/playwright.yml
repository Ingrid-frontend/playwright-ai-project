name: Playwright Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Cache Playwright Browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-playwright-
          
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Run auto-test workflow
      run: npx tsx scripts/auto-test-flow-no-sign.ts
      env:
        NODE_ENV: stage
        TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
        TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
        FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
        if-no-files-found: ignore
        
    - name: Upload test videos
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-videos
        path: test-results/
        retention-days: 7
        if-no-files-found: ignore
        
    - name: Upload screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: screenshots
        path: screenshots/
        retention-days: 7
        if-no-files-found: ignore
        
    - name: Upload screenshot comparison report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: screenshot-comparison-report
        path: results/screenshot-comparison.html
        retention-days: 30
        if-no-files-found: ignore
        
    - name: Upload diffs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: diffs
        path: results/diffs/
        retention-days: 30
        if-no-files-found: ignore
        
    - name: Upload Feishu document URL
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: feishu-doc-url
        path: results/feishu-doc-url.txt
        retention-days: 30
        if-no-files-found: ignore

  deploy:
    needs: test
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download screenshot comparison report
      uses: actions/download-artifact@v4
      with:
        name: screenshot-comparison-report
        path: ./report
        
    - name: Download screenshots
      uses: actions/download-artifact@v4
      with:
        name: screenshots
        path: ./screenshots
        
    - name: Download diffs
      uses: actions/download-artifact@v4
      with:
        name: diffs
        path: ./diffs
        
    - name: Copy screenshots and diffs to report directory
      run: |
        mkdir -p report/screenshots
        cp -r screenshots/* report/screenshots/ || true
        mkdir -p report/diffs
        cp -r diffs/* report/diffs/ || true
        
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./report
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  notify:
    needs: test
    if: failure()
    runs-on: ubuntu-latest
    steps:
    - name: Send notification
      run: echo "Tests failed! Please check the logs."
