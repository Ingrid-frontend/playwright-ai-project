name: Scheduled Test Jobs

on:
  schedule:
    - cron: '0 2 * * 1-5'
    - cron: '0 1 * * 1'
    - cron: '0 3 * * 2,4'
    - cron: '0 4 * * 3'
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      job_id:
        description: test-jobs.json 中的 job id
        required: false
        default: request-flow-golden
        type: choice
        options:
          - request-flow-golden
          - request-flow-golden-all-envs
          - request-flow-write
          - approval-flow-golden
          - approval-flow-write
          - catalog-drift-check
      playwright_env:
        description: 覆盖 Job 的 playwrightEnv（留空则用 Job 配置）
        required: false
        type: string
      account_profile:
        description: 限定账号档案（如 default；留空则按 meta 分组执行全部）
        required: false
        type: string

permissions:
  contents: read

jobs:
  test-job:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run test job
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "0 1 * * 1") JOB_ID=catalog-drift-check ;;
              "0 3 * * 2,4") JOB_ID=request-flow-write ;;
              "0 4 * * 3") JOB_ID=approval-flow-write ;;
              "0 22 * * *") JOB_ID=request-flow-golden-all-envs ;;
              *) JOB_ID=request-flow-golden ;;
            esac
          else
            JOB_ID="${{ inputs.job_id || 'request-flow-golden' }}"
          fi
          ARGS="run --id=${JOB_ID} --trigger=schedule"
          if [ -n "${{ inputs.playwright_env }}" ]; then
            ARGS="$ARGS --env=${{ inputs.playwright_env }}"
          fi
          if [ -n "${{ inputs.account_profile }}" ]; then
            ARGS="$ARGS --profile=${{ inputs.account_profile }}"
          fi
          echo "Running job: ${JOB_ID}"
          npm run test-job -- $ARGS
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}

      - name: Bundle CI artifacts
        if: always()
        run: npm run report:bundle-ci
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          CI_BUNDLE_TEST_RESULTS: ${{ job.status == 'failure' && '1' || '0' }}

      - name: Upload job results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-job-results-${{ github.event_name == 'schedule' && (github.event.schedule == '0 3 * * 2,4' && 'request-flow-write' || (github.event.schedule == '0 4 * * 3' && 'approval-flow-write' || (github.event.schedule == '0 22 * * *' && 'request-flow-golden-all-envs' || 'request-flow-golden'))) || (inputs.job_id || 'request-flow-golden') }}
          path: results/jobs/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-report-scheduled-${{ github.run_id }}
          path: ci-artifacts/
          retention-days: 30
          if-no-files-found: ignore
