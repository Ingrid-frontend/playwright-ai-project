name: Docs & Lint

# 离线门禁与浏览器 E2E 解耦，避免 stage 或凭证故障掩盖代码质量问题。

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Docs index
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # 硬门禁：索引完整性 + 链接有效性 + 返回链接，失败即挂。
      # 这三项是「加了文档忘了挂索引」的唯一防线，且零误报。
      - name: Check docs index
        run: npm run docs:check

  lint:
    name: Lint
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

  offline:
    name: Offline ${{ matrix.check }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [typecheck, smoke]
    env:
      FEISHU_BITABLE_AUTO: '0'
      FEISHU_NOTIFY_ON_COMPARE: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Verify spec-meta
        if: matrix.check == 'smoke'
        run: node scripts/verify/verify-spec-meta-flow.cjs --env=stage

      - name: Run offline check
        run: npm run ${{ matrix.check }}
